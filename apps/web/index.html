<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>makable</title>
    <meta name="color-scheme" content="light dark" />
    <!-- The theme before the first paint, so a dark theme doesn't flash light. Same key and rule as shared/lib/theme.ts. -->
    <script>
      ;(function () {
        var choice
        try {
          choice = JSON.parse(localStorage.getItem('makable:theme')).state.choice
        } catch (e) {}
        var dark = choice === 'dark' || (choice !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      })()
    </script>
    <meta name="description" content="An open-source AI website builder. Describe your site in a chat, get the code in your own GitHub repo, and host it for free." />

    <!-- Link previews (X, LinkedIn, Slack...). Their crawlers don't run JS, so these must be in the HTML; image URLs must be absolute. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="makable" />
    <meta property="og:url" content="https://makable.tech/" />
    <meta property="og:title" content="makable: build and host your website for free" />
    <meta property="og:description" content="An open-source AI website builder. Describe your site in a chat, get the code in your own GitHub repo, and host it for free." />
    <meta property="og:image" content="https://makable.tech/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="makable: build and host your website for free" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="makable: build and host your website for free" />
    <meta name="twitter:description" content="An open-source AI website builder. Describe your site in a chat, get the code in your own GitHub repo, and host it for free." />
    <meta name="twitter:image" content="https://makable.tech/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
