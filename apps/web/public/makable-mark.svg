<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Primary Gradients -->
    <linearGradient id="mk-g1" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#FF2E63" />
      <stop offset="60%" stop-color="#FF3366" />
      <stop offset="100%" stop-color="#FF5376" />
    </linearGradient>

    <linearGradient id="mk-g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3366" />
      <stop offset="50%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#BE185D" />
    </linearGradient>

    <linearGradient id="mk-g3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E11D48" />
      <stop offset="45%" stop-color="#FF5E3A" />
      <stop offset="100%" stop-color="#FF9500" />
    </linearGradient>

    <linearGradient id="mk-g4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA000" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <linearGradient id="mk-glow-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3366" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#FF7A00" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.3" />
    </linearGradient>

    <!-- Smooth drop shadow for depth between overlapping ribbons -->
    <filter id="mk-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <!-- Ambient glow filter -->
    <filter id="mk-ambient" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <g class="makable-glow" opacity="0.75" filter="url(#mk-ambient)">
    <path d="M19 78V35C19 22 29 14 41 14C49 14 55 18 58 24C61 18 67 14 75 14C87 14 97 22 97 35V78"
          stroke="url(#mk-glow-bg)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Ribbon Geometry -->
  <!-- 1. Left stem and outer shoulder -->
  <path d="M18 78V35C18 21.2 28.5 12 41 12C46.8 12 52 14.8 55.5 19.5L46.8 29.5C45.2 27.2 43.2 26 41 26C35.5 26 31 30.5 31 36.5V78H18Z"
        fill="url(#mk-g1)" />

  <!-- 2. Left inner fold curving inward -->
  <path d="M41 12C48 12 54 16 56.5 22.5L43.5 54C40 62.5 32.5 67 24 67H18V54H24C28 54 31.5 51.5 33.5 47L41 29L41 12Z"
        fill="url(#mk-g2)" opacity="0.95" />

  <!-- 3. Dynamic Center Fold & Rising Ribbon (Overlapping) -->
  <path filter="url(#mk-shadow)"
        d="M36 67C44 67 51 62 54.5 54L66 27.5C68.5 21.5 74 18 80.5 18C89.5 18 96.5 25 96.5 34V78H84V35C84 31 81 28 77 28C73.8 28 70.8 30 69.2 33.2L57 60C52.5 70 42.5 76 31 76H18V67H36Z"
        fill="url(#mk-g3)" />

  <!-- 4. Right shoulder & trailing violet facet -->
  <path d="M68 33.5C70.8 29.5 75.5 27 80.5 27C89 27 96 34 96 42.5V78H84V44C84 38.5 80.5 35 76 35C72.8 35 70 37 68.5 39.8L59 61.5L50 61.5L68 33.5Z"
        fill="url(#mk-g4)" />
</svg>