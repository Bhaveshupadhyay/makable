# Checks every pull request and push to main. Deploys only when asked, from main: a push whose last commit message has
# [deploy] (e.g. `git commit --allow-empty -m "Deploy [deploy]"`), or "Run workflow" in the Actions tab
# (`gh workflow run ci-cd.yml --ref main`). A deploy builds the SPA and runs `wrangler deploy` (wrangler.jsonc), which
# uploads it to the Cloudflare Worker (README.md, "Deploying").
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older run. Other runs never replace each other, so a waiting deploy
# isn't dropped for a later push that doesn't deploy.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The version that writes bun.lock; older ones can't read it.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

  deploy:
    needs: checks
    if: >-
      github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy]')))
    runs-on: ubuntu-latest
    # Holds the CLOUDFLARE_* secrets. Add required reviewers to it on GitHub to approve each deploy by hand.
    environment: production
    # One deploy at a time, and never cancelled half-way.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build
      # The wrangler pinned in package.json. The commit goes into the deployment's message, to tell deploys apart in
      # the dashboard (Worker → Deployments).
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy --message "${GITHUB_SHA::7}"
