# CodeRabbit reviews at most 100 files per PR. Files deleted by the move to
# prompt-built sites (the portfolio templates and the code that served them)
# and the lockfile have nothing to review, so they're left out.
reviews:
  path_filters:
    - '!**/bun.lock'
    - '!packages/templates/**'
    - '!apps/web/src/features/templates/**'
    - '!.claude/skills/verify-web/mock-model.mjs'
